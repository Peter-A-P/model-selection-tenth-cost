# Vendor fields merged into the request body for one alias, by `runner/gateway.py`.
#
# Not in boundary.yaml: that is the gateway's file, its route schema forbids unknown keys, and
# it is right to. These are a property of how this experiment asks a question rather than of
# where the question is sent, which is the same line the gateway drew when its own smoke command
# needed one: the value belongs to the caller, not the library.
#
# Everything here exists because a model returned no text. This project's answer-only format
# gives a reply 16 tokens, and a model that reasons first spends all 16 on the reasoning and
# has nothing left to answer with. That is not a model failing the task; it is a request shaped
# for a model that answers immediately. Each entry below names the call that proved it.

version: 1

aliases:
  # 2026-09-12: 0 of 3 items returned any text, 13 output tokens each, US$0.0014 spent on
  # nothing. The gateway merges these into the built `generationConfig` rather than replacing
  # it, so `maxOutputTokens` survives.
  google-frontier:
    generationConfig:
      thinkingConfig:
        thinkingBudget: 0

  # google-mid had one of these and it is gone again. gemini-3.5-flash-lite answers a
  # thinkingConfig with 400 INVALID_ARGUMENT where gemini-3.8-flash accepts it, so the field is
  # not a property of the vendor or even of the family. Its original problem was one reply
  # truncated mid-preamble at 16 tokens, which the 1024-token budget of section 15.14 solves
  # without asking the vendor for anything.

  # 2026-09-12: 0 of 3 returned text, 16 output tokens each, and the ledger could not cost the
  # row either. Together takes the effort as a top-level field.
  together-open-b:
    reasoning_effort: low


# Request fields this project must not send to a given model, because the model refuses them.
#
# Not the same as sending a different value. `temperature: 0` and no temperature at all are
# different requests, and only one of them is accepted by Anthropic's 5 family.
#
# Measured 2026-09-12 by `mselect smoke --no-batch`, six times, identically:
#   anthropic returned 400: invalid_request_error: `temperature` is deprecated for this model.
#
# The cost to the experiment is real and is recorded in PLAN.md section 15.11 rather than
# absorbed here: section 3.3 runs everything at temperature 0, and these two models cannot be.
# They run at Anthropic's default sampling, so their test-retest measures the vendor's default
# nondeterminism rather than the temperature-0 floor the other nine models measure.
omit:
  anthropic-sonnet: [temperature]
  anthropic-opus: [temperature]
  # 2026-09-12, three times identically:
  #   openai returned 400: Unsupported value: 'temperature' does not support 0.0 with this
  #   model. Only the default (1) value is supported.
  # A third model, and the second vendor, to take temperature away. Whatever the reason each
  # gives, the effect on this experiment is one thing: three of eleven models run at the
  # vendor's default sampling and cannot be pinned. PLAN.md section 15.11.
  openai-frontier: [temperature]

# Answer-only token budgets, where the default of 16 is not enough.
#
# Section 3.3 gives a reply a small budget because the format is answer-only: a letter, or a
# boxed value. A model that reasons before it answers needs room for the reasoning too, and
# giving it none does not produce a shorter answer, it produces no answer.
#
# Measured 2026-09-12: `anthropic-opus` returned no text on 2 of 3 smoke items, 16 output
# tokens spent each time, finish reason max_tokens. `anthropic-sonnet` answered all 3 inside
# 16, so this is a property of the model and not of the family.
#
# Left empty until the right number is measured rather than guessed:
# `mselect smoke --alias anthropic-opus --max-tokens N --yes` finds it, and changing the
# budget changes the request hash, so the items really are asked again.
#
# **2026-09-16, google-open-a.** The first entry this block has ever carried, and it is worth
# being explicit about why an override is allowed here when prompts.ANSWER_BUDGET says a
# per-model budget is a thumb on the scale. It is allowed because a cap is a ceiling and not a
# bill: a model that answers in 4 tokens spends 4 whether the cap is 1024 or 2048, so raising
# one model's ceiling changes nothing about any other model's answer. What it does change is
# whether this model gets to finish a sentence.
#
# Raising ANSWER_BUDGET for everyone would have been cleaner and is not available: the budget
# is part of the request body, so it is part of the request hash, and moving it would invalidate
# all 59,000 cached calls and force the whole panel to be re-run.
#
# The fact this override reports, as that comment requires: gemma-4-31b-it needs more than
# twenty times the tokens the median panel model uses to answer the same multiple-choice
# question. Measured on 2026-09-16, 1 of 3 smoke items spent 1,021 of 1,024 and returned no
# text at all, and four Gemma builds measured locally the same day wrote 114 to 800 tokens
# each. That is a property of the family and it belongs in finding 8.
tokens: {}
