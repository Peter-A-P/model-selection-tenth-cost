# Gateway configuration for the own-run panel (PLAN.md section 3.3).
#
# Every vendor call this project makes goes through the portfolio gateway, so that a model
# can be swapped in one file, every call has a cost record, and this project's spend cap is
# enforced before the request leaves. Keys come from the environment variables named below
# and never from this file.
#
# The panel is addressed by alias, not by vendor model identifier, which is the whole point:
# `prompts.py` names the aliases and nothing in the code goes stale when a vendor renames a
# model. Changing a route here moves every call that uses that alias.
#
# The opposite rule to the drift runner's, deliberately: development caching is ON here, so
# a rerun costs nothing. This project asks questions about the items, not about whether the
# vendor changed underneath it.

version: 1

providers:
  anthropic:
    kind: anthropic
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    api_version: "2023-06-01"
  openai:
    kind: openai_compat
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens_field: max_completion_tokens
  google:
    kind: google
    base_url: https://generativelanguage.googleapis.com
    api_key_env: GOOGLE_API_KEY
    api_version: v1beta
  openweights:
    kind: openai_compat
    base_url: https://api.together.xyz/v1
    api_key_env: OPENWEIGHTS_API_KEY
  # Small models on the laptop. They cost nothing and they spread the ability range
  # downward, which is where item calibration needs points it cannot buy.
  local:
    kind: openai_compat
    base_url: http://127.0.0.1:11434/v1
    price_zero: true

# The panel of PLAN.md section 3.3, one alias per entry in prompts.PANEL.
#
# **Confirmed against real calls on 2026-09-12** by `mselect smoke`, which is the only thing
# that settles a route. Seven of eleven answered and were scored. What the run found, and what
# was done about each:
#
#   anthropic-haiku      3/3 scored, 3 correct                     kept
#   openai-mid           3/3 scored, 3 correct                     kept
#   openai-frontier      3/3 scored, 3 correct                     model changed, see below
#   together-open-a      3/3 scored, 1 correct                     kept
#   local-small-a        4/4 scored, 2 correct                     kept
#   google-mid           2/3, one cut off mid-preamble             thinking disabled below
#   google-frontier      0/3, no text at all, US$0.0014 spent      thinking disabled below
#   together-open-b      0/3, no text at all, row uncosted         reasoning effort set below
#   local-small-b        0/4, the model was never pulled           changed to qwen2.5:3b
#   anthropic-sonnet     0/3, the batch errored                    UNRESOLVED, see below
#   anthropic-opus       0/3, the batch errored                    UNRESOLVED, see below
#
# `mselect models` settled the Anthropic question on 2026-09-12: Anthropic lists all eleven of
# its models and both `claude-sonnet-5` and `claude-opus-5` are among them. The identifiers were
# never wrong, so the batch failure is about the request rather than the route, and the two
# routes stay exactly as they are.
#
# Choosing the panel is a decision about the experiment, not a detail of the plumbing, so it is
# dated and recorded rather than assumed.
routes:
  anthropic-haiku:
    provider: anthropic
    model: claude-haiku-4-5-20251001
  anthropic-sonnet:
    provider: anthropic
    model: claude-sonnet-5
  anthropic-opus:
    provider: anthropic
    model: claude-opus-5
  openai-mid:
    provider: openai
    model: gpt-5.4-mini
  # Peter, 2026-09-12: gpt-5.4 was not the frontier and had not been for two releases.
  # OpenAI's own list carries gpt-5.5 and then the GPT-5.6 line, which is three models rather
  # than a size ladder. The prices separate them: luna 0.20/1.20, terra 2.00/12.00, sol
  # 4.00/20.00. sol is the closest thing OpenAI sells to Claude Opus 5 at 5.00/25.00, which is
  # what this slot is for, so sol it is. terra would pair with Sonnet 5 instead.
  openai-frontier:
    provider: openai
    model: gpt-5.6-sol
  # Both Gemini models reason before answering; see request-extras.yaml, which tells them not
  # to. Measured 2026-09-12: Flash returned nothing at all on all three smoke items at a cost
  # of US$0.0014, and Flash-Lite got one of three cut off mid-preamble.
  google-mid:
    provider: google
    model: gemini-3.5-flash-lite
  # Confirmed by Peter on 2026-09-14: gemini-3.8-flash is Google's current frontier model, so
  # the tier label is right and the "Flash means mid-tier" reading was a guess about naming.
  # It topped the panel on 2026-09-13 at 0.936. Its daily free-tier quota is the constraint
  # worth knowing about, not its price: 3,000 items is close to a day's allowance, and running
  # out refuses every remaining call for about 21 hours. PLAN.md sections 15.22 and 15.24.
  google-frontier:
    provider: google
    model: gemini-3.8-flash
  together-open-a:
    provider: openweights
    model: meta-llama/Llama-3.3-70B-Instruct-Turbo
  # gpt-oss reasons by default too: 16 output tokens spent, no text, on all three smoke items,
  # and the row was uncosted as well. See request-extras.yaml.
  together-open-b:
    provider: openweights
    model: openai/gpt-oss-120b
  local-small-a:
    provider: local
    model: llama3.2:3b
  # Peter's choice 2026-09-12. qwen2.5:7b was the first pick and was rejected as too large for
  # what was then believed to be a 4 GB card; section 7's constraint for this slot is 3B to 4B.
  #
  # **That hardware belief was wrong and is corrected here 2026-09-16.** There is no 4 GB card.
  # The machine is Intel integrated graphics with 2 GB and 64 GB of system RAM, so every local
  # model runs on the CPU out of RAM and the ceiling for this slot is RAM, not VRAM: a 9.6 GB
  # model loads without complaint. The slot keeps its 3B model anyway, because its job is to sit
  # at the bottom of the ability range, which a larger model would not do.
  #
  # What actually bounds a local slot is decode speed, and it is severe: measured 2026-09-16,
  # this CPU runs a 5B model at 7.7 tokens/s and an 8B at 6.4. A model that answers in 12 tokens
  # is therefore fine and one that reasons for 800 is not, whatever its parameter count. See
  # PLAN.md section 15.33 for the two Gemma 4 builds this ruled out.
  local-small-b:
    provider: local
    model: qwen2.5:3b
  # The rung between 3B and the hosted models, added 2026-09-16 after being rejected twice.
  #
  # Rejected on 2026-09-12 for being 4.7 GB against a 4 GB card that does not exist, and again on
  # 2026-09-16 on wall clock, 26 hours. Peter's call to buy the hours: findings 7 and 8 both claim
  # a capability gradient, and without this alias the evidence for it is two 3B models at one end
  # and nine hosted models at the other, with capability, vendor and harness moving together.
  #
  # Same family as `local-small-b` on purpose. `qwen2.5:3b` and `qwen2.5:7b` share a training
  # recipe and a harness, so the comparison between them moves capability and nothing else, which
  # is the only controlled comparison this panel can contain.
  #
  # Measured 2026-09-16 on eight real bank items: 4 output tokens at the median, 18.4 s/call,
  # 8/8 parsed. It is seven times faster than an 8B Gemma because it does what it is told.
  local-mid-a:
    provider: local
    model: qwen2.5:7b
prices: prices
caps: caps.yaml

defaults:
  # Answer-only output. The framing experiment's reasoning template asks for more and says
  # so per request; this is the floor, not the rule.
  max_tokens: 16
  timeouts:
    connect_s: 10
    read_s: 120

retry:
  max_attempts: 4
  base_delay_s: 0.5
  max_delay_s: 30

ledger:
  path: ../../out/own-run-ledger.sqlite
  env: local

telemetry:
  exporter: none

# Every response cached by request content hash, so a rerun costs nothing. This is the rule
# for this project and the opposite of the drift runner's; do not confuse them.
cache:
  enabled: true
  path: ../../out/own-run-cache
