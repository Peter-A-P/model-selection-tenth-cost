<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="748" viewBox="0 0 1160 748" role="img" aria-label="From a prior ability the test picks the item carrying the most Fisher information at that ability, balanced across benchmarks, administers it from the recorded answers or a live call, updates the ability by expected a posteriori with its standard error, and stops at a target precision or when two models have come apart; random subsampling at the same budget usually fails to settle it." font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
