[project]
name = "mselect"
version = "0.3.0"
description = "Model selection at a tenth of the cost: item response theory and adaptive testing over language-model benchmarks."
readme = "README.md"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Peter Parker" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["item response theory", "adaptive testing", "benchmarks", "evaluation", "psychometrics"]

dependencies = [
  # The response matrix, the EM fit and every statistic in irt/ and cat/. 2.x is the current
  # line and its API is stable; 3 does not exist yet.
  "numpy>=2,<3",
  # Normal quadrature, the tetrachoric root find, Kendall's tau, the chi-square and normal
  # tails. 1.x has been the line for a decade.
  "scipy>=1,<2",
  # Matrix assembly and the frozen item bank as Parquet, with no pyarrow dependency.
  "polars>=1,<2",
  # Fetching the public per-item results: thousands of small files over one pooled
  # connection. Pinned below 1 because httpx is still pre-1.0.
  "httpx>=0.28,<1",
  # Column projection over HTTP range requests when reading the Open LLM Leaderboard's
  # Parquet conversions: polars reads a file-like object straight through, pyarrow seeks to
  # the column chunks it was asked for, which is 2 MB of a 71 MB file. 25.x is current.
  "pyarrow>=21,<26",
  # TLS verified against the operating system's trust store. On a network that inspects TLS,
  # certifi's bundle does not contain the proxy's root and every hub request fails
  # verification. 0.x is the only line; pinned below 1.
  "truststore>=0.10,<1",
  # Command line. 0.x is the only line; pinned below 1.
  "typer>=0.15,<1",
  # The charts in the README and the write-up. 3.x is the current line.
  "matplotlib>=3,<4",
  # Every vendor call in the own-run panel (PLAN.md section 3.3) goes through the portfolio
  # gateway: routing by alias, one ledger row and one span per call, this project's spend cap
  # enforced there, and Anthropic's Message Batches at half price. Pinned to >=0.2 because the
  # batch endpoint arrived in 0.2.0; below 1 because Part B of that project is a major bump.
  "boundary>=0.2,<1",
  # The routing, price and cap files are YAML, and this project reads them directly to price a
  # run before making one. It arrived transitively through the gateway before; a module that
  # imports it declares it. 6.x is the current line.
  "pyyaml>=6,<7",
]

[tool.uv.sources]
# A private repository, installed from the tag. CI authenticates with a fine-grained
# read-only token held as the BOUNDARY_GITHUB_TOKEN secret; the tag, not a branch, so a
# lockfile resolves to one commit and a rerun is the same library.
boundary = { git = "https://github.com/Peter-A-P/compliant-ai-gateway", tag = "v0.2.0" }

[project.urls]
Repository = "https://github.com/Peter-A-P/model-selection-tenth-cost"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "mypy>=1,<2",
  "ruff>=0.13,<1",
  # Mocks the gateway's httpx transport, so the one place this project talks to a vendor is
  # tested without talking to one. Same pin as the gateway repository uses.
  "respx>=0.22,<1",
  # Stubs for the YAML reader above, so `mypy --strict` checks the config parsing rather than
  # waving it through as Any.
  "types-PyYAML>=6,<7",
]

[project.scripts]
mselect = "mselect.cli:app"

[build-system]
requires = ["hatchling>=1,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mselect"]

[tool.ruff]
line-length = 100
target-version = "py313"
# ruff formats Python blocks inside Markdown by default; the plan and docs keep their layout.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# The answer-parser fixtures deliberately contain curly quotes, typographic dashes and
# confusable unicode digits, because upstream benchmark text and model output contain them.
"tests/test_parsers.py" = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["mselect", "tests"]
warn_unreachable = true

[[tool.mypy.overrides]]
# Neither ships type information that mypy --strict accepts.
module = ["matplotlib.*", "scipy.*", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
